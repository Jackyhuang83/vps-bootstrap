name: Promote ss2022 Candidate

on:
  push:
    branches:
      - main
    paths:
      - "ss2022.next.v*.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-ss2022-main
  cancel-in-progress: false

jobs:
  validate-and-promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TARGET: ss2022.sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest candidate
        shell: python
        run: |
          import glob, os, re, sys

          filename_re = re.compile(r'^ss2022\.next\.(v\d+\.\d+\.\d+(?:-dev\d+)?)\.sh$')
          version_re = re.compile(r'^v(\d+)\.(\d+)\.(\d+)(?:-dev(\d+))?$')

          def parse(v):
              m = version_re.fullmatch(v)
              if not m:
                  raise ValueError(v)
              a, b, c = map(int, m.group(1, 2, 3))
              d = m.group(4)
              return (a, b, c, 1, 0) if d is None else (a, b, c, 0, int(d))

          files = sorted(glob.glob('ss2022.next.v*.sh'))
          if not files:
              print('::error::No versioned candidate found (expected ss2022.next.vX.Y.Z[-devN].sh)')
              sys.exit(1)

          valid = []
          invalid = []
          for path in files:
              name = os.path.basename(path)
              m = filename_re.fullmatch(name)
              if not m:
                  invalid.append(name)
                  continue
              valid.append((parse(m.group(1)), m.group(1), name))

          if invalid:
              print('::error::Invalid candidate filename(s): ' + ', '.join(invalid))
              sys.exit(1)
          if not valid:
              print('::error::No valid versioned candidate found')
              sys.exit(1)

          _, file_version, candidate = max(valid, key=lambda x: x[0])

          with open(candidate, 'r', encoding='utf-8') as fh:
              text = fh.read()

          m_script = re.search(r'^SCRIPT_VERSION="([^"]+)"$', text, re.M)
          m_header = re.search(r'^# 当前版本: (.+)$', text, re.M)
          if not m_script or not m_header:
              print('::error::Candidate version markers missing')
              sys.exit(1)

          script_version = m_script.group(1).strip()
          header_version = m_header.group(1).strip()
          if script_version != file_version:
              print(f'::error::Filename/script version mismatch: {file_version} != {script_version}')
              sys.exit(1)
          if header_version != script_version:
              print(f'::error::Header/SCRIPT_VERSION mismatch: {header_version} != {script_version}')
              sys.exit(1)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'CANDIDATE={candidate}\n')
              env.write(f'NEW_VERSION={script_version}\n')

          print(f'Selected candidate: {candidate}')
          print(f'Candidate version: {script_version}')

      - name: Validate identity and current version
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$CANDIDATE" ]] || { echo "::error::Missing $CANDIDATE"; exit 1; }
          [[ -f "$TARGET" ]] || { echo "::error::Missing $TARGET"; exit 1; }

          head -n1 "$CANDIDATE" | grep -qx '#!/bin/bash'
          grep -qx '# 项目名称: vps-bootstrap / ss2022.sh' "$CANDIDATE"

          OLD_VERSION="$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)".*/\1/p' "$TARGET" | head -n1)"
          version_re='^v[0-9]+\.[0-9]+\.[0-9]+(-dev[0-9]+)?$'
          [[ "$OLD_VERSION" =~ $version_re ]] || { echo "::error::Invalid current version"; exit 1; }
          [[ "$NEW_VERSION" =~ $version_re ]] || { echo "::error::Invalid candidate version"; exit 1; }

          echo "OLD_VERSION=$OLD_VERSION" >> "$GITHUB_ENV"

      - name: Require newer version
        shell: python
        run: |
          import os, re, sys
          p = re.compile(r"^v(\d+)\.(\d+)\.(\d+)(?:-dev(\d+))?$")
          def parse(v):
              m = p.fullmatch(v)
              a, b, c = map(int, m.group(1, 2, 3))
              d = m.group(4)
              return (a, b, c, 1, 0) if d is None else (a, b, c, 0, int(d))
          old_v = os.environ["OLD_VERSION"]
          new_v = os.environ["NEW_VERSION"]
          if parse(new_v) <= parse(old_v):
              print(f"::error::Candidate must be newer: {old_v} -> {new_v}")
              sys.exit(1)

      - name: Bash syntax check
        run: bash -n "$CANDIDATE"

      - name: ShellCheck
        run: shellcheck --severity=error -x "$CANDIDATE"

      - name: Check critical functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in apply_singbox_candidate protocol_management routing_management forwarding_management server_management_tools server_test_management check_script_update full_uninstall main; do
            grep -Eq "^${fn}\(\)[[:space:]]*\{" "$CANDIDATE" || { echo "::error::Missing function: $fn"; exit 1; }
          done

      - name: Size and hash checks
        shell: bash
        run: |
          set -euo pipefail
          OLD_BYTES="$(wc -c < "$TARGET")"
          NEW_BYTES="$(wc -c < "$CANDIDATE")"
          (( NEW_BYTES >= OLD_BYTES / 2 )) || { echo "::error::Candidate too small"; exit 1; }
          (( NEW_BYTES <= OLD_BYTES * 2 )) || { echo "::error::Candidate too large"; exit 1; }

          OLD_SHA="$(sha256sum "$TARGET" | awk '{print $1}')"
          NEW_SHA="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          [[ "$OLD_SHA" != "$NEW_SHA" ]] || { echo "::error::Candidate identical to current"; exit 1; }

          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"
          echo "OLD_BYTES=$OLD_BYTES" >> "$GITHUB_ENV"
          echo "NEW_BYTES=$NEW_BYTES" >> "$GITHUB_ENV"

      - name: Generate diff
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git diff --no-index -- "$TARGET" "$CANDIDATE" > promotion-diff.patch
          rc=$?
          set -e
          [[ "$rc" -le 1 ]] || exit "$rc"

          {
            echo "## ss2022 promotion preflight"
            echo ""
            echo "- Current: \`$OLD_VERSION\`"
            echo "- Candidate: \`$NEW_VERSION\`"
            echo "- Candidate file: \`$CANDIDATE\`"
            echo "- Current bytes: $OLD_BYTES"
            echo "- Candidate bytes: $NEW_BYTES"
          } >> "$GITHUB_STEP_SUMMARY"

          git diff --no-index --stat -- "$TARGET" "$CANDIDATE" || true

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss2022-promotion-diff
          path: promotion-diff.patch
          retention-days: 30

      - name: Promote candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$CANDIDATE" "$TARGET"
          chmod 0755 "$TARGET"
          bash -n "$TARGET"
          [[ "$(sha256sum "$TARGET" | awk '{print $1}')" == "$NEW_SHA" ]]
          rm -f "$CANDIDATE"

          # Stable promotions also advance the README's formal-version markers.
          if [[ "$NEW_VERSION" != *-dev* && -f README.md ]]; then
            python - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["NEW_VERSION"]
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")

          # Promote the public README atomically with a stable script release.
          text = re.sub(r'当前正式版本：\*\*v\d+\.\d+\.\d+\*\*',
                        f'当前正式版本：**{version}**', text)
          text = re.sub(r'^当前开发版本：\*\*v\d+\.\d+\.\d+-dev\d+\*\*\s*\n?',
                        '', text, flags=re.M)

          text = re.sub(
              r'^> v\d+\.\d+\.\d+ 为当前稳定正式版.*\n'
              r'> v1\.9\.x 为当前开发线.*\n?',
              f'> {version} 为当前稳定正式版。Debian / Ubuntu + systemd 正式支持；'
              'Alpine 3.21 + OpenRC 正式支持 SS2022、ShadowTLS v3、VLESS Reality、Realm '
              '以及服务器管理/测试。Snell v5 与 Cloudflare WARP 在 Alpine 暂不开放。\n',
              text,
              flags=re.M,
          )

          text = re.sub(
              r'^\| \*\*稳定正式版\*\* \| .* \|$',
              f'| **稳定正式版** | {version}：Debian / Ubuntu + systemd；Alpine 3.21 + OpenRC |',
              text,
              flags=re.M,
          )
          text = re.sub(r'^\| \*\*v1\.9 开发版\*\* \| .* \|\n?', '', text, flags=re.M)

          text = text.replace('# 当前开发策略', '# 版本策略')
          text = text.replace('v1.8.1 为当前稳定正式版。', 'v1.8.1 为上一稳定正式版。')
          text = text.replace('## v1.9.x', '## v1.9.0')
          text = re.sub(
              r'^当前开发版为 \*\*v1\.9\.0-dev\d+\*\*，重点是 Alpine / OpenRC 与卸载闭环收口：$',
              f'当前稳定正式版为 **{version}**，本版本完成 Alpine / OpenRC 与卸载闭环收口：',
              text,
              flags=re.M,
          )
          text = re.sub(
              r'^v1\.9\.x 在完成更充分的 Alpine 实机验证前仍属于开发线，不替代 v1\.8\.1 稳定版。$',
              f'{version} 已完成发布前收口并成为当前稳定正式版；后续优先处理 Bug、稳定性和兼容性问题。',
              text,
              flags=re.M,
          )

          if re.search(r'^当前开发版本：\*\*v\d+\.\d+\.\d+-dev\d+\*\*', text, flags=re.M):
              raise SystemExit('README still exposes a development version after stable promotion')
          if re.search(r'^当前开发版为 \*\*v\d+\.\d+\.\d+-dev\d+\*\*', text, flags=re.M):
              raise SystemExit('README release-strategy section still exposes a development version')

          p.write_text(text, encoding="utf-8")
          PY
          fi

          git add -- "$TARGET" "$CANDIDATE" README.md
          git diff --cached --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: promote ss2022 ${OLD_VERSION} -> ${NEW_VERSION}"
          git push origin HEAD:main

      - name: Create stable GitHub Release
        if: ${{ !contains(env.NEW_VERSION, '-dev') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$NEW_VERSION" >/dev/null 2>&1; then
            echo "Release $NEW_VERSION already exists; skipping."
            exit 0
          fi

          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["NEW_VERSION"]
          target = os.environ["TARGET"]
          lines = Path(target).read_text(encoding="utf-8").splitlines()

          marker = f"# {version} Release:"
          notes = []
          capture = False
          for line in lines:
              if line == marker:
                  capture = True
                  continue
              if not capture:
                  continue
              if line.startswith("# v") and line.endswith(":"):
                  break
              if line.startswith("#   - "):
                  notes.append("- " + line[len("#   - "):])
              elif line == "#" and notes:
                  break

          if not notes:
              notes = [f"- 正式发布 {version}。"]

          body = [f"## {version}", "", *notes]
          Path("release-notes.md").write_text("\n".join(body) + "\n", encoding="utf-8")
          PY

          {
            echo ""
            echo "### SHA256"
            echo '~~~text'
            sha256sum "$TARGET" | awk '{print $1}'
            echo '~~~'
          } >> release-notes.md

          gh release create "$NEW_VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "$NEW_VERSION" \
            --notes-file release-notes.md
