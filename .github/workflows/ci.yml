name: CI

on:
  push:
    branches:
      - main
    paths:
      - "ss2022.sh"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "ss2022.sh"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ss2022.sh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n ss2022.sh

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --severity=error -x ss2022.sh

      - name: Check script version
        run: |
          if ! grep -Eq '^SCRIPT_VERSION="v[0-9]+\.[0-9]+\.[0-9]+(-dev[0-9]+)?"$' ss2022.sh; then
            echo "ERROR: SCRIPT_VERSION format is invalid."
            exit 1
          fi

          version=$(grep -E '^SCRIPT_VERSION=' ss2022.sh | head -n1)
          echo "Detected ${version}"

      - name: Check critical functions
        shell: bash
        run: |
          required_functions=(
            protocol_management
            routing_management
            forwarding_management
            server_management_tools
            server_test_management
            check_script_update
          )

          missing=0

          for fn in "${required_functions[@]}"; do
            if grep -Eq "^${fn}\(\)[[:space:]]*\{" ss2022.sh; then
              echo "OK: ${fn}"
            else
              echo "ERROR: missing function: ${fn}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Check full uninstall managed units
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f full_uninstall)

          grep -Fq 'ss2022-tg-monitor.timer' <<<"$body"
          grep -Fq '"$TG_MONITOR_SERVICE"' <<<"$body"
          grep -Fq '"$TG_MONITOR_TIMER"' <<<"$body"

      - name: Guard IPv6-only hosts preservation
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f prepare_ipv6_env)

          if grep -Fq '/etc/hosts' <<<"$body"; then
            echo "ERROR: prepare_ipv6_env must not modify /etc/hosts."
            exit 1
          fi

      - name: Guard IPv6-only APT mirror preservation
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f prepare_ipv6_env)

          if grep -Fq '/etc/apt/mirrors/' <<<"$body"; then
            echo "ERROR: prepare_ipv6_env must not rewrite administrator APT mirror files."
            exit 1
          fi

      - name: Guard managed WARP cleanup
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          full_body=$(declare -f full_uninstall)
          menu_body=$(declare -f warp_uninstall_client)

          grep -Fq '[[ -f "$WARP_MANAGED_MARKER" ]]' <<<"$full_body"
          grep -Fq 'rm -f "$WARP_MANAGED_MARKER"' <<<"$full_body"
          grep -Fq '[[ -f "$WARP_MANAGED_MARKER" ]]' <<<"$menu_body"
          grep -Fq 'rm -f "$WARP_MANAGED_MARKER"' <<<"$menu_body"

      - name: Guard uninstall runtime-file cleanup
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f full_uninstall)

          grep -Fq '"$SCRIPT_BACKUP_PATH"' <<<"$body"
          grep -Fq '"$SINGBOX_OPENRC_PID"' <<<"$body"
          grep -Fq '"$XRAY_OPENRC_PID"' <<<"$body"
          grep -Fq '"$SNELL_OPENRC_PID"' <<<"$body"
          grep -Fq '"$REALM_OPENRC_PID"' <<<"$body"
          grep -Fq '/run/ss2022-tg-monitor.lockdir' <<<"$body"

      - name: Summary
        run: |
          echo "CI passed."
          echo "Lines: $(wc -l < ss2022.sh)"
          echo "Version: $(grep -E '^SCRIPT_VERSION=' ss2022.sh | head -n1)"
