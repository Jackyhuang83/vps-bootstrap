name: CI

on:
  push:
    branches:
      - main
    paths:
      - "ss2022.sh"
      - "tests/network-tuning-smoke.sh"
      - "tests/network-throughput-smoke.sh"
      - "tests/network-qoe-smoke.sh"
      - "tests/network-candidate-smoke.sh"
      - "README.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/promote-ss2022.yml"
      - ".github/workflows/promote-ss2022.yml"

  pull_request:
    branches:
      - main
    paths:
      - "ss2022.sh"
      - "tests/network-tuning-smoke.sh"
      - "tests/network-throughput-smoke.sh"
      - "tests/network-qoe-smoke.sh"
      - "tests/network-candidate-smoke.sh"
      - "README.md"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ss2022.sh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n ss2022.sh

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --severity=error -x ss2022.sh

      - name: Network tuning transactional regression
        shell: bash
        run: |
          bash -n tests/network-tuning-smoke.sh
          bash tests/network-tuning-smoke.sh

      - name: Network tuning dev2 throughput regression
        shell: bash
        run: |
          bash -n tests/network-throughput-smoke.sh
          bash tests/network-throughput-smoke.sh

      - name: Network tuning dev3 QoE regression
        shell: bash
        run: |
          bash -n tests/network-qoe-smoke.sh
          bash tests/network-qoe-smoke.sh

      - name: Network tuning dev4 candidate regression
        shell: bash
        run: |
          bash -n tests/network-candidate-smoke.sh
          bash tests/network-candidate-smoke.sh

      - name: Check script version
        run: |
          if ! grep -Eq '^SCRIPT_VERSION="v[0-9]+\.[0-9]+\.[0-9]+(-dev[0-9]+)?"$' ss2022.sh; then
            echo "ERROR: SCRIPT_VERSION format is invalid."
            exit 1
          fi

          version=$(grep -E '^SCRIPT_VERSION=' ss2022.sh | head -n1)
          echo "Detected ${version}"

      - name: Validate workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts "OK: #{f}" }'

      - name: Guard stable promotion README sync
        shell: bash
        run: |
          workflow=".github/workflows/promote-ss2022.yml"

          grep -Fq "Promote the public README atomically with a stable script release." "$workflow"
          grep -Fq "当前开发版本" "$workflow"
          grep -Fq "稳定正式版" "$workflow"
          grep -Fq "当前开发策略" "$workflow"
          grep -Fq "README still exposes a development version after stable promotion" "$workflow"
          grep -Fq "README release-strategy section still exposes a development version" "$workflow"

      - name: Check critical functions
        shell: bash
        run: |
          required_functions=(
            protocol_management
            routing_management
            forwarding_management
            server_management_tools
            server_test_management
            check_script_update
          )

          missing=0

          for fn in "${required_functions[@]}"; do
            if grep -Eq "^${fn}\(\)[[:space:]]*\{" ss2022.sh; then
              echo "OK: ${fn}"
            else
              echo "ERROR: missing function: ${fn}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Check full uninstall managed units
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f full_uninstall)

          grep -Fq 'ss2022-tg-monitor.timer' <<<"$body"
          grep -Fq '"$TG_MONITOR_SERVICE"' <<<"$body"
          grep -Fq '"$TG_MONITOR_TIMER"' <<<"$body"

      - name: Guard IPv6-only hosts preservation
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f prepare_ipv6_env)

          if grep -Fq '/etc/hosts' <<<"$body"; then
            echo "ERROR: prepare_ipv6_env must not modify /etc/hosts."
            exit 1
          fi

      - name: Guard IPv6-only APT mirror preservation
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f prepare_ipv6_env)

          if grep -Fq '/etc/apt/mirrors/' <<<"$body"; then
            echo "ERROR: prepare_ipv6_env must not rewrite administrator APT mirror files."
            exit 1
          fi

      - name: Guard managed WARP cleanup
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          full_body=$(declare -f full_uninstall)
          menu_body=$(declare -f warp_uninstall_client)
          repo_body=$(declare -f warp_repo_is_project_managed)
          remove_body=$(declare -f warp_remove_managed_install_assets)

          grep -Fq 'warp_package_is_project_managed' <<<"$full_body"
          grep -Fq 'warp_repo_is_project_managed' <<<"$full_body"
          grep -Fq 'warp_remove_managed_install_assets' <<<"$full_body"
          grep -Fq 'warp_package_is_project_managed' <<<"$menu_body"
          grep -Fq 'warp_repo_is_project_managed' <<<"$menu_body"
          grep -Fq 'warp_remove_managed_install_assets' <<<"$menu_body"

          grep -Fq '[[ -f "$WARP_REPO_MANAGED_MARKER" ]]' <<<"$repo_body"
          grep -Fq '[[ -f "$WARP_MANAGED_MARKER" && ! -f "$WARP_OWNERSHIP_V2_MARKER" ]]' <<<"$repo_body"
          grep -Fq 'rm -f "$WARP_APT_SOURCE" "$WARP_APT_KEYRING"' <<<"$remove_body"
          grep -Fq 'rm -f "$WARP_MANAGED_MARKER" "$WARP_REPO_MANAGED_MARKER" "$WARP_OWNERSHIP_V2_MARKER"' <<<"$remove_body"

      - name: Guard WARP partial-install ownership
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f warp_install_client)

          repo_marker_line=$(grep -nF 'touch "$WARP_OWNERSHIP_V2_MARKER" "$WARP_REPO_MANAGED_MARKER"' <<<"$body" | head -n1 | cut -d: -f1)
          keyring_line=$(grep -nF 'gpg --yes --dearmor --output "$WARP_APT_KEYRING"' <<<"$body" | head -n1 | cut -d: -f1)
          source_line=$(grep -nF '> "$WARP_APT_SOURCE"' <<<"$body" | head -n1 | cut -d: -f1)
          package_marker_line=$(grep -nF 'touch "$WARP_OWNERSHIP_V2_MARKER" "$WARP_MANAGED_MARKER"' <<<"$body" | head -n1 | cut -d: -f1)
          package_install_line=$(grep -nF 'apt-get install -y cloudflare-warp' <<<"$body" | head -n1 | cut -d: -f1)

          for n in "$repo_marker_line" "$keyring_line" "$source_line" "$package_marker_line" "$package_install_line"; do
            [[ "$n" =~ ^[0-9]+$ ]]
          done
          [[ "$repo_marker_line" -lt "$keyring_line" ]]
          [[ "$repo_marker_line" -lt "$source_line" ]]
          [[ "$package_marker_line" -lt "$package_install_line" ]]

          grep -Fq '[[ -e "$WARP_APT_SOURCE" || -e "$WARP_APT_KEYRING" ]]' <<<"$body"
          grep -Fq '当前仅复用，不接管其 ownership' <<<"$body"

      - name: Guard uninstall runtime-file cleanup
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f full_uninstall)

          grep -Fq '"$SCRIPT_BACKUP_PATH"' <<<"$body"
          grep -Fq '"$SINGBOX_OPENRC_PID"' <<<"$body"
          grep -Fq '"$XRAY_OPENRC_PID"' <<<"$body"
          grep -Fq '"$SNELL_OPENRC_PID"' <<<"$body"
          grep -Fq '"$REALM_OPENRC_PID"' <<<"$body"
          grep -Fq '/run/ss2022-tg-monitor.lockdir' <<<"$body"
          grep -Fq 'rm -rf /tmp/ss2022-*' <<<"$body"

      - name: Guard ForceIPv6 ownership
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          [[ "$FORCE_IPV6_CONF" == "/etc/apt/apt.conf.d/99ss2022-force-ipv6" ]]
          [[ "$FORCE_IPV6_LEGACY_CONF" == "/etc/apt/apt.conf.d/99force-ipv6" ]]

          prepare_body=$(declare -f prepare_ipv6_env)
          restore_body=$(declare -f restore_ipv4_apt_and_dns_if_needed)

          grep -Fq '"$FORCE_IPV6_CONF"' <<<"$prepare_body"
          grep -Fq 'rm -f "$FORCE_IPV6_CONF"' <<<"$restore_body"
          grep -Fq '"$FORCE_IPV6_LEGACY_CONF"' <<<"$restore_body"
          if grep -Eq 'rm -f[^\n]*FORCE_IPV6_LEGACY_CONF' ss2022.sh; then
            echo "ERROR: legacy generic 99force-ipv6 must not be auto-deleted."
            exit 1
          fi

      - name: Guard DNS backup ownership
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          [[ "$BACKUP_DNS" == "/root/.ss2022-resolv.conf.bak" ]]
          [[ "$LEGACY_BACKUP_DNS" == "/root/resolv.conf.orig" ]]

          prepare_body=$(declare -f prepare_ipv6_env)
          restore_body=$(declare -f restore_ipv4_apt_and_dns_if_needed)
          full_body=$(declare -f full_uninstall)

          grep -Fq '"$BACKUP_DNS"' <<<"$prepare_body"
          if grep -Fq '"$LEGACY_BACKUP_DNS"' <<<"$prepare_body"; then
            echo "ERROR: prepare_ipv6_env must not create or reuse the legacy DNS backup path."
            exit 1
          fi
          grep -Fq '"$LEGACY_BACKUP_DNS"' <<<"$restore_body"
          grep -Fq 'restore_ipv4_apt_and_dns_if_needed' <<<"$full_body"

      - name: Guard service ownership markers
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          grep -Fq 'ensure_managed_system_user' <<<"$(declare -f ensure_singbox_user)"
          grep -Fq 'ensure_managed_system_user' <<<"$(declare -f ensure_xray_user)"
          grep -Fq 'ensure_managed_system_user' <<<"$(declare -f ensure_realm_user)"
          grep -Fq 'ensure_managed_system_user' <<<"$(declare -f ensure_snell_user)"

          full_body=$(declare -f full_uninstall)
          grep -Fq '"$SINGBOX_GROUP_MARKER"' <<<"$full_body"
          grep -Fq '"$XRAY_GROUP_MARKER"' <<<"$full_body"
          grep -Fq '"$REALM_GROUP_MARKER"' <<<"$full_body"
          grep -Fq '"$SNELL_GROUP_MARKER"' <<<"$full_body"

      - name: Guard shared config directory ownership
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          [[ "$SINGBOX_CONF_DIR" == "/etc/sing-box" ]]
          [[ "$SNELL_CONF_DIR" == "/etc/snell" ]]
          [[ "$SINGBOX_DIR_MARKER" == "/etc/ss2022-singbox-dir-managed" ]]
          [[ "$SNELL_DIR_MARKER" == "/etc/ss2022-snell-dir-managed" ]]

          dir_body=$(declare -f ensure_project_config_dir)
          sb_body=$(declare -f ensure_base_singbox_config)
          snell_body=$(declare -f apply_snell_config)
          migrate_body=$(declare -f migrate_singbox_local_dns_prefer_go)
          full_body=$(declare -f full_uninstall)

          grep -Fq '[[ ! -d "$dir" ]]' <<<"$dir_body"
          grep -Fq 'touch "$marker"' <<<"$dir_body"
          grep -Fq '[[ -f "$marker" ]]' <<<"$dir_body"
          grep -Fq 'ensure_singbox_config_dir' <<<"$sb_body"
          grep -Fq 'ensure_snell_config_dir' <<<"$snell_body"
          grep -Fq 'singbox_is_project_managed || return 0' <<<"$migrate_body"

          if grep -Fq 'rm -rf /etc/sing-box' <<<"$full_body" ||
             grep -Fq 'rm -rf /etc/snell' <<<"$full_body"; then
            echo "ERROR: full uninstall must not recursively delete shared config directories."
            exit 1
          fi
          grep -Fq 'rm -f "$SINGBOX_CONF" "${SINGBOX_CONF_DIR}"/.ss2022-*' <<<"$full_body"
          grep -Fq 'rm -f "$SNELL_CONF" "${SNELL_CONF_DIR}"/.ss2022-*' <<<"$full_body"
          grep -Fq 'rmdir "$SINGBOX_CONF_DIR"' <<<"$full_body"
          grep -Fq 'rmdir "$SNELL_CONF_DIR"' <<<"$full_body"

          if grep -Fq '/etc/snell-v5.conf.tmp.' ss2022.sh ||
             grep -Fq '/etc/sing-box/config.routing.' ss2022.sh ||
             grep -Fq '/etc/sing-box/config.json.tmp.' ss2022.sh; then
            echo "ERROR: config transaction files must use the .ss2022-* namespace."
            exit 1
          fi

      - name: Guard external sing-box ownership
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          install_body=$(declare -f install_singbox_core)
          full_body=$(declare -f full_uninstall)

          grep -Fq 'singbox_assert_safe_ownership' <<<"$install_body"
          grep -Fq 'mark_singbox_project_managed' <<<"$install_body"
          grep -Fq 'singbox_managed' <<<"$full_body"
          grep -Fq '"$SINGBOX_MANAGED_MARKER"' <<<"$full_body"

      - name: Guard Alpine Snell support boundary
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          install_body=$(declare -f install_snell_v5_core)
          component_body=$(declare -f component_single_menu)
          upgrade_body=$(declare -f upgrade_all_to_recommended)
          protocol_body=$(declare -f protocol_management)

          grep -Fq 'platform_is_alpine' <<<"$install_body"
          grep -Fq 'return 1' <<<"$install_body"
          grep -Fq '[[ "$c" == "snell" ]]' <<<"$component_body"
          grep -Fq '[[ "$c" == "snell" ]]' <<<"$upgrade_body"
          grep -Fq 'Snell v5                [Alpine 暂不支持]' <<<"$protocol_body"

      - name: Guard IPv6 keepalive ownership
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          [[ "$IPV6_KEEPALIVE_SYSTEMD_SERVICE" == "/etc/systemd/system/ss2022-ipv6-keepalive.service" ]]
          [[ "$IPV6_KEEPALIVE_SYSTEMD_TIMER" == "/etc/systemd/system/ss2022-ipv6-keepalive.timer" ]]

          setup_body=$(declare -f setup_keepalive)
          full_body=$(declare -f full_uninstall)
          legacy_body=$(declare -f legacy_ipv6_keepalive_is_project_managed)
          cleanup_body=$(declare -f cleanup_legacy_ipv6_keepalive_if_managed)

          grep -Fq '"$IPV6_KEEPALIVE_SYSTEMD_SERVICE"' <<<"$setup_body"
          grep -Fq '"$IPV6_KEEPALIVE_SYSTEMD_TIMER"' <<<"$setup_body"
          grep -Fq 'cleanup_legacy_ipv6_keepalive_if_managed' <<<"$setup_body"
          grep -Fq '"$IPV6_KEEPALIVE_SYSTEMD_SERVICE"' <<<"$full_body"
          grep -Fq '"$IPV6_KEEPALIVE_SYSTEMD_TIMER"' <<<"$full_body"
          grep -Fq 'cleanup_legacy_ipv6_keepalive_if_managed' <<<"$full_body"

          if grep -Fq 'systemctl disable --now ipv6-keepalive.timer' <<<"$full_body" ||
             grep -Fq '/etc/systemd/system/ipv6-keepalive.service' <<<"$full_body" ||
             grep -Fq '/etc/systemd/system/ipv6-keepalive.timer' <<<"$full_body"; then
            echo "ERROR: full_uninstall must not directly stop/delete generic IPv6 keepalive units."
            exit 1
          fi

          grep -Fq 'Description=IPv6 HTTPS Keepalive Probe' <<<"$legacy_body"
          grep -Fq 'ExecStart=/usr/bin/curl -6fsSI --max-time 5 https://www.cloudflare.com' <<<"$legacy_body"
          grep -Fq 'legacy_ipv6_keepalive_is_project_managed || return 0' <<<"$cleanup_body"

      - name: Guard Snell candidate cleanup
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          install_body=$(declare -f install_snell_v5_core)
          full_body=$(declare -f full_uninstall)

          [[ "$SNELL_CANDIDATE_PREFIX" == "/usr/local/bin/.ss2022-snell-server-v5.new" ]]
          grep -Fq 'candidate="${SNELL_CANDIDATE_PREFIX}.$"' <<<"$install_body"
          grep -Fq '"${SNELL_CANDIDATE_PREFIX}".*' <<<"$full_body"

      - name: Guard SSH transactional backup cleanup
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh
          body=$(declare -f server_tool_ssh_add_port)

          grep -Fq 'backup="${dropin}.bak.$(date +%Y%m%d-%H%M%S)"' <<<"$body"
          grep -Fq 'backup="${STATE_DIR}/sshd_config.bak.$(date +%Y%m%d-%H%M%S)"' <<<"$body"
          grep -Fq 'rm -f "$backup"' <<<"$body"

      - name: Guard proxy shortcut ownership
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          update_body=$(declare -f check_script_update)
          full_body=$(declare -f full_uninstall)

          grep -Fq 'ensure_proxy_shortcut' <<<"$update_body"
          if grep -Fq 'ln -sf "$SCRIPT_INSTALL_PATH" "$SCRIPT_PROXY_LINK"' <<<"$update_body"; then
            echo "ERROR: script update must not force-overwrite /usr/local/bin/proxy."
            exit 1
          fi
          grep -Fq 'proxy_link_managed' <<<"$full_body"
          if grep -Fq 'rm -f /usr/local/bin/proxy' <<<"$full_body"; then
            echo "ERROR: full uninstall must not unconditionally delete /usr/local/bin/proxy."
            exit 1
          fi

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          SCRIPT_INSTALL_PATH="$tmpdir/ss2022"
          SCRIPT_PROXY_LINK="$tmpdir/proxy"
          printf 'project\n' > "$SCRIPT_INSTALL_PATH"

          printf 'external\n' > "$SCRIPT_PROXY_LINK"
          ensure_proxy_shortcut
          [[ ! -L "$SCRIPT_PROXY_LINK" ]]
          grep -Fxq external "$SCRIPT_PROXY_LINK"

          rm -f "$SCRIPT_PROXY_LINK"
          ensure_proxy_shortcut
          [[ -L "$SCRIPT_PROXY_LINK" ]]
          proxy_shortcut_is_project_managed

      - name: Guard proxy shortcut presentation
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          dashboard_body=$(declare -f show_dashboard)
          grep -Fq 'proxy_shortcut_is_project_managed' <<<"$dashboard_body"

          if grep -Fq 'ln -sf /usr/local/bin/ss2022 /usr/local/bin/proxy' README.md; then
            echo "ERROR: README must not force-overwrite an existing /usr/local/bin/proxy."
            exit 1
          fi

      - name: Guard current version consistency
        shell: bash
        run: |
          version=$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)".*/\1/p' ss2022.sh | head -n1)
          header=$(sed -n 's/^# 当前版本: \(.*\)$/\1/p' ss2022.sh | head -n1)

          [[ "$header" == "$version" ]] || {
            echo "ERROR: header/SCRIPT_VERSION mismatch: ${header} != ${version}"
            exit 1
          }

          if [[ "$version" == *-dev* ]]; then
            marker="# ${version}:"
            grep -Fq "当前开发版本：**${version}**" README.md || {
              echo "ERROR: README development version does not match ${version}"
              exit 1
            }
          else
            marker="# ${version} Release:"
            grep -Fq "当前正式版本：**${version}**" README.md || {
              echo "ERROR: README stable version does not match ${version}"
              exit 1
            }
            if grep -Eq '^当前开发版本：\*\*v[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+\*\*' README.md; then
              echo "ERROR: stable release README still exposes a current development version."
              exit 1
            fi
          fi

          count=$(grep -Fc "$marker" ss2022.sh)
          if [[ "$count" -ne 1 ]]; then
            echo "ERROR: changelog must contain exactly one current-version marker: ${marker}"
            exit 1
          fi

      - name: Guard external Snell ownership
        shell: bash
        run: |
          export SS2022_LIB_ONLY=1
          # shellcheck disable=SC1091
          source ./ss2022.sh

          install_body=$(declare -f install_snell_v5_core)
          full_body=$(declare -f full_uninstall)
          protocol_body=$(declare -f protocol_exists_snell)

          grep -Fq 'snell_assert_safe_ownership' <<<"$install_body"
          grep -Fq 'mark_snell_project_managed' <<<"$install_body"
          grep -Fq 'snell_managed' <<<"$full_body"
          grep -Fq '"$SNELL_MANAGED_MARKER"' <<<"$full_body"
          grep -Fq 'snell_is_project_managed' <<<"$protocol_body"

      - name: Summary
        run: |
          echo "CI passed."
          echo "Lines: $(wc -l < ss2022.sh)"
          echo "Version: $(grep -E '^SCRIPT_VERSION=' ss2022.sh | head -n1)"
