name: ShellCheck

on:
  push:
    paths:
      - "ss2022.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "ss2022.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n ss2022.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck --severity=error ss2022.sh
